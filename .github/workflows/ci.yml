name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # sounddevice imports PortAudio's shared library at import time; the
      # ubuntu runner does not ship it, which turned the whole suite into
      # 5 collection errors and exit code 2 (invisible on Windows/macOS where
      # the wheel bundles it).
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2
      # Ratchet gate: fails only when a change ADDS lint/type findings.
      # The 117 ruff / 13 basedpyright findings that predate this branch are the
      # committed baseline; the numbers may only go down (.lint-baseline.json).
      - run: uv run python scripts/lint_ratchet.py
      # Lazily imported modules (pystray, uiautomation, pyobjc) are invisible to
      # PyInstaller; 0.8.0-beta.3 shipped an exe that died with "No module named
      # 'pystray'" because build.bat never listed it. Fail the gate, not the user.
      - run: uv run python scripts/check_bundled_imports.py
      - run: uv run pytest tests -m "not integration" -q
