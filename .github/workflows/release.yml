name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # Ratchet gate: fails only when a change ADDS lint/type findings.
      # The 117 ruff / 13 basedpyright findings that predate this branch are the
      # committed baseline; the numbers may only go down (.lint-baseline.json).
      - run: uv run python scripts/lint_ratchet.py
      - run: uv run pytest tests -m "not integration" -q
      - name: Tag must match app/__init__.py __version__
        run: |
          # Normalise before comparing: a tag may be written v0.8.0-rc1 while
          # __version__ carries PEP 440's 0.8.0rc1, and v0.7 vs 0.7.0.
          norm() {
            echo "$1" | sed -e "s/^v//" -e "s/-//g" \
              | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 }'
          }
          tag="${GITHUB_REF_NAME}"
          ver=$(uv run python -c "import app; print(app.__version__)")
          echo "tag=$tag version=$ver normalised=$(norm "$tag") vs $(norm "$ver")"
          test "$(norm "$tag")" = "$(norm "$ver")"

  build:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: xxl-whisper.exe
          - os: macos-15
            asset: xxl-whisper-arm64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmd /c build.bat
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 需要仓库里的 docs/releases/<tag>.md 作为发版说明，所以这里也要检出。
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Write release checksums
        working-directory: dist
        run: |
          sha256sum xxl-whisper.exe | cut -d' ' -f1 > xxl-whisper.exe.sha256
          sha256sum xxl-whisper-arm64.zip | cut -d' ' -f1 > xxl-whisper-arm64.zip.sha256
          ls -l ./*.sha256
      - name: Resolve release metadata (prerelease flag + notes source)
        id: meta
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          # 带 "-" 的 tag 一律发成预发布（预发布不会被 /releases/latest 返回，
          # 所以 App 内的更新检查不会把它推给稳定版用户）。
          case "$tag" in
            *-*) echo "flags=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *)   echo "flags=" >> "$GITHUB_OUTPUT" ;;
          esac
          # 手写说明优先：docs/releases/<tag>.md；没有就让 GitHub 按 commit 生成。
          if [ -f "docs/releases/$tag.md" ]; then
            echo "notes=--notes-file docs/releases/$tag.md" >> "$GITHUB_OUTPUT"
          else
            echo "notes=--generate-notes" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag flags=$(grep -o 'flags=.*' "$GITHUB_OUTPUT" || true)"
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 故意不加引号：这里要按空格拆成多个参数。
          FLAGS: ${{ steps.meta.outputs.flags }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/xxl-whisper.exe dist/xxl-whisper.exe.sha256 \
            dist/xxl-whisper-arm64.zip dist/xxl-whisper-arm64.zip.sha256 \
            --title "$GITHUB_REF_NAME" $NOTES $FLAGS --repo "$GITHUB_REPOSITORY" \
          || gh release upload "$GITHUB_REF_NAME" \
            dist/xxl-whisper.exe dist/xxl-whisper.exe.sha256 \
            dist/xxl-whisper-arm64.zip dist/xxl-whisper-arm64.zip.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
